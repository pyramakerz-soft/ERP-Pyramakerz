version: 0.2

env:
  variables:
    NUGET_PACKAGES: "/root/.nuget/packages"
    npm_config_cache: "/root/.cache/npm"
    NG_BUILD_CACHE_PATH: "/root/.cache/angular"
    DOTNET_ROOT: "/root/.dotnet"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    DOTNET_NOLOGO: "1"
    NUGET_XMLDOC_MODE: "skip"
    NODE_OPTIONS: "--max-old-space-size=4096"
    MSBUILD_TREAT_WARNINGS_AS_MESSAGES: "true"
    MSBUILDDISABLENODEREUSE: "1"

phases:
  install:
    runtime-versions:
      dotnet: 8.0
      nodejs: 20
    commands:
      - 'echo ---- INSTALL PHASE ----'
      - 'if ! dotnet --list-sdks | grep -q "^9\\."; then curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh; chmod +x dotnet-install.sh; ./dotnet-install.sh --version 9.0.302 --install-dir $DOTNET_ROOT; fi'
      - 'export PATH="$DOTNET_ROOT:$PATH:/root/.dotnet/tools"'
      - 'dotnet --version'
      - 'dotnet tool install --global dotnet-ef --version 9.0.10 --verbosity quiet || dotnet tool update --global dotnet-ef --version 9.0.10 --verbosity quiet'
      - 'cd LMS_CMS_Frontend && npm ci --legacy-peer-deps --no-audit --no-fund --prefer-offline && cd ..'

  pre_build:
    commands:
      - 'export PATH="$DOTNET_ROOT:$PATH:/root/.dotnet/tools"'
      - 'echo ---- PRE_BUILD: FRONTEND ----'
      - 'cd LMS_CMS_Frontend && npm run build --prod --silent && cd ..'
      - 'echo ---- PRE_BUILD: BACKEND PUBLISH ----'
      - 'mkdir -p LMS_CMS_Backend/LMS_CMS/wwwroot'
      - 'cp -r LMS_CMS_Frontend/dist/lms-cms-frontend/browser/* LMS_CMS_Backend/LMS_CMS/wwwroot/ || true'
      - 'dotnet publish LMS_CMS_Backend/LMS_CMS/LMS_CMS_PL.csproj -c Release -o final --verbosity minimal --nologo -m:1 -p:BuildInParallel=false'
      - 'dotnet ef database update --project LMS_CMS_Backend/LMS_CMS/LMS_CMS_PL.csproj --context Octa_DbContext --configuration Release --no-build'
  post_build:
    commands:
      - 'echo ---- DONE ----'
artifacts:
  base-directory: final
  files:
    - '**/*'

cache:
  paths:
    - '/root/.nuget/packages/**/*'
    - '/root/.dotnet/tools/**/*'
    - '/root/.cache/npm/**/*'
    - '/root/.cache/angular/**/*'  
